[package]
name = "devsweep"
version = "0.1.0"
description = "Find and remove rebuildable developer files: build output, dependency folders and package caches"
edition = "2024"

[dependencies]
dirs = "7.0.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]

# The scanner walks millions of folders. Some optimisation keeps `tauri dev` usable.
[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
