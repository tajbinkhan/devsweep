name: Release

# Publishing a GitHub Release (for example with tag v0.2.0) builds DevSweep for Windows and
# Linux and attaches the downloads to that release. The version inside the app and in the
# file names comes from the tag, so tauri.conf.json does not need editing for each release.
#
# Running the workflow by hand builds everything as workflow artifacts without publishing,
# which is useful to try a build before releasing it.
#
# Only the publish job can change the release. The build job runs third-party actions and
# project dependencies, so it gets a read-only token and hands its files over as artifacts.
#
# Installed copies of DevSweep update themselves from latest.json, which the sign job writes
# and the publish job uploads last. Signing needs the TAURI_SIGNING_PRIVATE_KEY secret (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD when the key has a password).
#
# Windows code signing goes through SignPath and needs the SIGNPATH_ORGANIZATION_ID variable
# and the SIGNPATH_API_TOKEN secret. Without the variable, the Windows files stay unsigned.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          # The oldest supported Ubuntu, so the .deb and AppImage run on older glibc too.
          - name: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PLATFORM: ${{ matrix.name }}
          EVENT: ${{ github.event_name }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          # The Windows installer and the .deb/.rpm need a plain x.y.z version.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "{\"version\": \"$version\"}" > "$RUNNER_TEMP/version.conf.json"
          echo "Building DevSweep $version"
          # When the Windows files are going to be code-signed, they go to the authenticode job
          # under another name, and that job uploads the signed copies under the usual name.
          if [ "$PLATFORM" = windows ] && [ "$EVENT" = release ] && [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
            echo "artifact=Unsigned-$PLATFORM-$version" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=DevSweep-$PLATFORM-$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Third-party actions are pinned to commits because tags and branches can be moved.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # Not bash: on Windows, Git Bash enables the backup and restore privileges for what it
      # starts, which lets deletes ignore the deny rules the access-denied test depends on.
      - name: Run tests
        shell: pwsh
        working-directory: src-tauri
        run: cargo test

      - name: Install npm packages
        run: npm ci

      - name: Build
        run: npx tauri build --config "$RUNNER_TEMP/version.conf.json"

      - name: Collect Windows downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "src-tauri/target/release"
          $files = @("$out/devsweep.exe")
          if (Test-Path "$out/WebView2Loader.dll") { $files += "$out/WebView2Loader.dll" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $files -DestinationPath "dist/DevSweep_${{ steps.version.outputs.version }}_x64-portable.zip" -Force
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe dist/

      - name: Collect Linux downloads
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb dist/
          cp src-tauri/target/release/bundle/rpm/*.rpm dist/
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist/

      - name: Keep downloads as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/*
          if-no-files-found: error

  # Code-signs the Windows exe and installer through SignPath, so Windows names the publisher
  # instead of warning about an unrecognized app. It runs on a release once the
  # SIGNPATH_ORGANIZATION_ID variable is set; until then the unsigned files are published as
  # before. A release sends two signing requests, the exe and then the installer that holds
  # it, and an approver has to approve each one in SignPath while this job waits.
  authenticode:
    name: Code-sign Windows downloads
    needs: build
    if: github.event_name == 'release' && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    # Leaves an hour for each approval.
    timeout-minutes: 150
    permissions:
      contents: read
      # SignPath downloads the unsigned files from this run and checks how they were built.
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check the SignPath token
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (-not $env:SIGNPATH_API_TOKEN) {
            "::error::SIGNPATH_ORGANIZATION_ID is set but the SIGNPATH_API_TOKEN secret is missing."
            exit 1
          }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Tauri CLI
        run: npm ci

      - name: Work out the version
        id: version
        run: |
          $version = $env:TAG -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          @{ version = $version } | ConvertTo-Json -Compress | Set-Content "$env:RUNNER_TEMP/version.conf.json"

      - name: Fetch the unsigned Windows downloads
        uses: actions/download-artifact@v4
        with:
          name: Unsigned-windows-${{ steps.version.outputs.version }}
          path: unsigned

      # The portable zip holds the exe as Tauri left it. The installer gets a copy with the
      # marker that tauri build would have written, because the signed copy must not change.
      - name: Prepare the exe for signing
        run: |
          Expand-Archive "unsigned/DevSweep_${{ steps.version.outputs.version }}_x64-portable.zip" unsigned/portable
          New-Item -ItemType Directory -Force exe/portable, exe/installer | Out-Null
          Copy-Item unsigned/portable/devsweep.exe exe/portable/
          node .github/scripts/mark-nsis-exe.mjs unsigned/portable/devsweep.exe exe/installer/devsweep.exe

      - name: Upload the exe for signing
        id: upload-exe
        uses: actions/upload-artifact@v4
        with:
          name: signpath-exe
          path: exe/
          retention-days: 1
          if-no-files-found: error

      # The artifact configurations named here are copies of the files in .github/signpath.
      - name: Sign the exe
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'devsweep' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe

      # --no-binary-patching stops tauri bundle from writing the marker into the signed exe.
      - name: Pack the signed exe into the installer
        run: |
          New-Item -ItemType Directory -Force src-tauri/target/release, installer | Out-Null
          Copy-Item signed-exe/installer/devsweep.exe src-tauri/target/release/devsweep.exe
          npx tauri bundle --bundles nsis --no-binary-patching --config "$env:RUNNER_TEMP/version.conf.json"
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe installer/

      - name: Upload the installer for signing
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: signpath-installer
          path: installer/
          retention-days: 1
          if-no-files-found: error

      - name: Sign the installer
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'devsweep' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer

      - name: Check the signatures and collect the downloads
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installer = Get-ChildItem signed-installer/*-setup.exe
          foreach ($f in @("signed-exe/portable/devsweep.exe", $installer.FullName)) {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "$f is not signed: $($sig.StatusMessage)" }
            "$f is signed by $($sig.SignerCertificate.Subject)"
          }
          $portable = @("signed-exe/portable/devsweep.exe")
          if (Test-Path unsigned/portable/WebView2Loader.dll) { $portable += "unsigned/portable/WebView2Loader.dll" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $portable -DestinationPath "dist/DevSweep_${version}_x64-portable.zip"
          Copy-Item $installer dist/

      - name: Keep the signed downloads as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevSweep-windows-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  # Signs the downloads that update themselves (the Windows installer and the AppImage) and
  # writes latest.json, which installed copies of DevSweep read to find the new version. The
  # signing key lives only in this job, which runs the Tauri CLI and nothing else, not in the
  # build job, which runs every crate's build script.
  # The installer is signed here after the authenticode job, because code signing changes the
  # file and would no longer match this signature.
  sign:
    name: Sign updates
    needs: [build, authenticode]
    # Also runs when the authenticode job was skipped because SignPath is not set up.
    if: >-
      !cancelled() && github.event_name == 'release' && needs.build.result == 'success' &&
      (needs.authenticode.result == 'success' || needs.authenticode.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Tauri CLI
        run: npm ci

      - name: Fetch the built downloads
        uses: actions/download-artifact@v4
        with:
          pattern: DevSweep-*
          path: dist
          merge-multiple: true

      - name: Sign the installer and the AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so installed copies could not update."
            exit 1
          fi
          for f in dist/*-setup.exe dist/*.AppImage; do
            # The version goes into the signature, so a manifest cannot pass an old download off as new.
            npx tauri signer sign --app-version "${TAG#v}" "$f"
          done

      - name: Write latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          export RELEASE_NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          export RELEASE_DATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          mkdir -p updater
          node .github/scripts/updater-manifest.mjs dist "${TAG#v}" "$TAG" "$GITHUB_REPOSITORY" updater/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: updater
          path: updater/latest.json
          if-no-files-found: error

  publish:
    name: Publish downloads
    # Runs only after every platform has built and the updates are signed, so a release never
    # gets a partial set of files.
    needs: [build, authenticode, sign]
    if: "!cancelled() && github.event_name == 'release' && needs.sign.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the built downloads
        uses: actions/download-artifact@v4
        with:
          pattern: DevSweep-*
          path: dist
          merge-multiple: true

      - name: Fetch latest.json
        uses: actions/download-artifact@v4
        with:
          name: updater
          path: updater

      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      # Last, so installed copies only hear about the release once its downloads are there.
      - name: Announce the release to installed copies
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" updater/latest.json --clobber --repo "$GITHUB_REPOSITORY"
