name: Release

# Publishing a GitHub Release (for example with tag v0.2.0) builds DevSweep for Windows and
# Linux and attaches the downloads to that release. The version inside the app and in the
# file names comes from the tag, so tauri.conf.json does not need editing for each release.
#
# Running the workflow by hand builds everything as workflow artifacts without publishing,
# which is useful to try a build before releasing it.
#
# Only the publish job can change the release. The build job runs third-party actions and
# project dependencies, so it gets a read-only token and hands its files over as artifacts.
#
# Installed copies of DevSweep update themselves from latest.json, which the sign job writes
# and the publish job uploads last. Signing needs the TAURI_SIGNING_PRIVATE_KEY secret (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD when the key has a password).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          # The oldest supported Ubuntu, so the .deb and AppImage run on older glibc too.
          - name: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          # The Windows installer and the .deb/.rpm need a plain x.y.z version.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "{\"version\": \"$version\"}" > "$RUNNER_TEMP/version.conf.json"
          echo "Building DevSweep $version"

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Third-party actions are pinned to commits because tags and branches can be moved.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # Not bash: on Windows, Git Bash enables the backup and restore privileges for what it
      # starts, which lets deletes ignore the deny rules the access-denied test depends on.
      - name: Run tests
        shell: pwsh
        working-directory: src-tauri
        run: cargo test

      - name: Install npm packages
        run: npm ci

      - name: Build
        run: npx tauri build --config "$RUNNER_TEMP/version.conf.json"

      - name: Collect Windows downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "src-tauri/target/release"
          $files = @("$out/devsweep.exe")
          if (Test-Path "$out/WebView2Loader.dll") { $files += "$out/WebView2Loader.dll" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $files -DestinationPath "dist/DevSweep_${{ steps.version.outputs.version }}_x64-portable.zip" -Force
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe dist/

      - name: Collect Linux downloads
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb dist/
          cp src-tauri/target/release/bundle/rpm/*.rpm dist/
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist/

      - name: Keep downloads as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevSweep-${{ matrix.name }}-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  # Signs the downloads that update themselves (the Windows installer and the AppImage) and
  # writes latest.json, which installed copies of DevSweep read to find the new version. The
  # signing key lives only in this job, which runs the Tauri CLI and nothing else, not in the
  # build job, which runs every crate's build script.
  sign:
    name: Sign updates
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Tauri CLI
        run: npm ci

      - name: Fetch the built downloads
        uses: actions/download-artifact@v4
        with:
          pattern: DevSweep-*
          path: dist
          merge-multiple: true

      - name: Sign the installer and the AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so installed copies could not update."
            exit 1
          fi
          for f in dist/*-setup.exe dist/*.AppImage; do
            # The version goes into the signature, so a manifest cannot pass an old download off as new.
            npx tauri signer sign --app-version "${TAG#v}" "$f"
          done

      - name: Write latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          export RELEASE_NOTES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          export RELEASE_DATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          mkdir -p updater
          node .github/scripts/updater-manifest.mjs dist "${TAG#v}" "$TAG" "$GITHUB_REPOSITORY" updater/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: updater
          path: updater/latest.json
          if-no-files-found: error

  publish:
    name: Publish downloads
    # Runs only after every platform has built and the updates are signed, so a release never
    # gets a partial set of files.
    needs: [build, sign]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the built downloads
        uses: actions/download-artifact@v4
        with:
          pattern: DevSweep-*
          path: dist
          merge-multiple: true

      - name: Fetch latest.json
        uses: actions/download-artifact@v4
        with:
          name: updater
          path: updater

      - name: Attach downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      # Last, so installed copies only hear about the release once its downloads are there.
      - name: Announce the release to installed copies
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" updater/latest.json --clobber --repo "$GITHUB_REPOSITORY"
