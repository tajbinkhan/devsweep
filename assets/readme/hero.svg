<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">DevSweep</title>
  <desc id="desc">DevSweep finds the folders your development tools can rebuild and deletes only the ones that are safe. A scan result lists a Rust target folder next to Cargo.toml (6.1 GB, rebuilds on its own), a Python .venv next to pyproject.toml (2.8 GB, check first), a node_modules folder next to package.json (1.8 GB, needs reinstall), and a node_modules folder inside Program Files that is never offered.</desc>

  <style>
    .sans { font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  </style>

  <!-- Background: DevSweep's dark theme -->
  <rect x="0.5" y="0.5" width="1199" height="439" rx="24" fill="#0f1514" stroke="#2a3632"/>

  <!-- Title block -->
  <g id="title-block">
    <text x="64" y="84" class="mono" font-size="17" letter-spacing="2" fill="#6d7c78">WINDOWS · LINUX · DESKTOP APP</text>

    <!-- App logo: three shrinking bars -->
    <g transform="translate(64 108) scale(2)">
      <rect x="1" y="1" width="30" height="30" rx="8" fill="#14534a"/>
      <rect x="7" y="8" width="18" height="4" rx="2" fill="#ecf8f0" fill-opacity="0.45"/>
      <rect x="7" y="14" width="12.5" height="4" rx="2" fill="#ecf8f0"/>
      <rect x="7" y="20" width="7" height="4" rx="2" fill="#34d399"/>
    </g>
    <text x="150" y="162" class="sans" font-size="72" font-weight="700" fill="#e6eeeb" letter-spacing="-1">DevSweep</text>

    <text class="sans" font-size="27" fill="#9aaaa5">
      <tspan x="64" y="240">Finds the folders your dev tools can rebuild</tspan>
      <tspan x="64" y="278">and deletes only the ones that are <tspan fill="#e6eeeb" font-weight="600">safe</tspan>.</tspan>
    </text>

    <!-- Real figure from the README: 63 GB of Rust target on a 100 GB drive -->
    <text x="64" y="356" class="mono" font-size="18" fill="#9aaaa5"><tspan fill="#f97316" font-weight="700">63 GB</tspan> of a 100 GB drive was Rust target/</text>
    <rect x="64" y="372" width="520" height="12" rx="6" fill="#1d2724"/>
    <rect x="64" y="372" width="327.6" height="12" rx="6" fill="#f97316"/>
  </g>

  <!-- Scan result panel, drawn like the app's table -->
  <g id="project-proof" transform="translate(644 40)">
    <rect width="508" height="360" rx="14" fill="#161e1c" stroke="#2a3632"/>
    <text x="24" y="34" class="sans" font-size="18" font-weight="600" fill="#e6eeeb">Project folders</text>
    <text x="484" y="34" text-anchor="end" class="sans" font-size="16" fill="#6d7c78">sorted by size</text>
    <line x1="0" y1="52" x2="508" y2="52" stroke="#2a3632"/>

    <!-- Row 1: Rust target -->
    <g transform="translate(0 52)">
      <rect x="1" y="0" width="506" height="66" fill="#34d399" fill-opacity="0.07"/>
      <rect x="24" y="15" width="20" height="20" rx="5" fill="#34d399"/>
      <path d="M28.5 25.5l4 4 7-8" fill="none" stroke="#0f1514" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="32" class="mono" font-size="21" font-weight="700" fill="#e6eeeb">target</text>
      <text x="484" y="32" text-anchor="end" class="sans" font-size="21" font-weight="700" fill="#e6eeeb">6.1 GB</text>
      <text x="60" y="56" class="sans" font-size="18" fill="#9aaaa5">next to Cargo.toml</text>
      <rect x="296" y="40" width="188" height="24" rx="12" fill="#123a2e"/>
      <circle cx="310" cy="52" r="3.5" fill="#6ee7b7"/>
      <text x="320" y="58" class="sans" font-size="16" font-weight="600" fill="#6ee7b7">Rebuilds on its own</text>
      <line x1="0" y1="66" x2="508" y2="66" stroke="#2a3632"/>
    </g>

    <!-- Row 2: Python .venv -->
    <g transform="translate(0 118)">
      <rect x="24" y="15" width="20" height="20" rx="5" fill="none" stroke="#6d7c78" stroke-width="2"/>
      <text x="60" y="32" class="mono" font-size="21" font-weight="700" fill="#e6eeeb">.venv</text>
      <text x="484" y="32" text-anchor="end" class="sans" font-size="21" font-weight="700" fill="#e6eeeb">2.8 GB</text>
      <text x="60" y="56" class="sans" font-size="18" fill="#9aaaa5">next to pyproject.toml</text>
      <rect x="368" y="40" width="116" height="24" rx="12" fill="#3b1d0e"/>
      <circle cx="382" cy="52" r="3.5" fill="#f97316"/>
      <text x="392" y="58" class="sans" font-size="16" font-weight="600" fill="#f97316">Check first</text>
      <line x1="0" y1="66" x2="508" y2="66" stroke="#2a3632"/>
    </g>

    <!-- Row 3: node_modules -->
    <g transform="translate(0 184)">
      <rect x="1" y="0" width="506" height="66" fill="#34d399" fill-opacity="0.07"/>
      <rect x="24" y="15" width="20" height="20" rx="5" fill="#34d399"/>
      <path d="M28.5 25.5l4 4 7-8" fill="none" stroke="#0f1514" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="32" class="mono" font-size="21" font-weight="700" fill="#e6eeeb">node_modules</text>
      <text x="484" y="32" text-anchor="end" class="sans" font-size="21" font-weight="700" fill="#e6eeeb">1.8 GB</text>
      <text x="60" y="56" class="sans" font-size="18" fill="#9aaaa5">next to package.json</text>
      <rect x="338" y="40" width="146" height="24" rx="12" fill="#352a0b"/>
      <circle cx="352" cy="52" r="3.5" fill="#fbbf24"/>
      <text x="362" y="58" class="sans" font-size="16" font-weight="600" fill="#fbbf24">Needs reinstall</text>
      <line x1="0" y1="66" x2="508" y2="66" stroke="#2a3632"/>
    </g>

    <!-- Row 4: installed app, never offered -->
    <g transform="translate(0 250)" opacity="0.75">
      <g transform="translate(24 14)" fill="none" stroke="#b4c0d6" stroke-width="2" stroke-linejoin="round">
        <rect x="2" y="9" width="16" height="12" rx="2.5" fill="#232c3b"/>
        <path d="M6 9V6a4 4 0 0 1 8 0v3"/>
      </g>
      <text x="60" y="32" class="mono" font-size="21" font-weight="700" fill="#9aaaa5">node_modules</text>
      <text x="484" y="32" text-anchor="end" class="sans" font-size="21" font-weight="700" fill="#6d7c78">—</text>
      <text x="60" y="56" class="sans" font-size="18" fill="#9aaaa5">inside Program Files</text>
      <rect x="350" y="40" width="134" height="24" rx="12" fill="#232c3b"/>
      <circle cx="364" cy="52" r="3.5" fill="#b4c0d6"/>
      <text x="374" y="58" class="sans" font-size="16" font-weight="600" fill="#b4c0d6">Never offered</text>
    </g>

    <!-- Footer -->
    <line x1="0" y1="316" x2="508" y2="316" stroke="#2a3632"/>
    <text x="24" y="344" class="sans" font-size="18" fill="#9aaaa5">2 selected, <tspan fill="#e6eeeb" font-weight="700">7.9 GB</tspan></text>
    <rect x="334" y="324" width="150" height="28" rx="7" fill="#f97316"/>
    <text x="409" y="344" text-anchor="middle" class="sans" font-size="16" font-weight="600" fill="#1c0d03">Delete selected</text>
  </g>
</svg>
